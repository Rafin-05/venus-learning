# Judge0 CE configuration for Venus Learning (self-hosted).
#
# Based on the official judge0.conf (judge0/judge0 master, fetched
# 2026-11-28). Only the values this deployment changes are set here;
# everything else uses Judge0's built-in defaults (see the official file).
#
# Passwords are deliberately NOT in this file: they come from the container
# environment (JUDGE0_POSTGRES_PASSWORD / JUDGE0_REDIS_PASSWORD in the
# project's .env, passed through compose.yaml). This file is sourced when
# the server/worker start, so do NOT add a blank POSTGRES_PASSWORD= or
# REDIS_PASSWORD= line here — it would override the environment value.
#
# Auth is off: Judge0's AUTHN_TOKEN default is empty, so the API needs no
# key. That is safe here because Judge0 is only reachable inside the
# Compose network (no published ports) and only the Venus Learning API
# talks to it. Do not publish port 2358 to the host without setting an
# AUTHN_TOKEN first.

# Do not phone home with usage telemetry.
JUDGE0_TELEMETRY_ENABLE=false

# Production mode (this is also Judge0's default).
RAILS_ENV=production

# Point Judge0 at the renamed Compose services (the official file uses
# db / redis, which would collide with this project's own services).
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
REDIS_HOST=judge0-redis
