worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types; default_type application/octet-stream; server_tokens off;
 log_format upstream '$remote_addr $request_method $uri $status upstream=$upstream_addr rt=$request_time'; access_log /var/log/nginx/access.log upstream;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m; limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s; limit_req_status 429;
 client_max_body_size 6m; client_body_timeout 15s; keepalive_timeout 30s;
 upstream api_pool { least_conn; server api1:8000 max_fails=3 fail_timeout=15s; server api2:8000 max_fails=3 fail_timeout=15s; keepalive 32; }
 upstream frontend_pool { least_conn; server frontend:3000 max_fails=3 fail_timeout=15s; keepalive 16; }
 server { listen 80; server_name _;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_hide_header X-Powered-By; proxy_connect_timeout 5s; proxy_read_timeout 45s;
  location ~ ^/api/auth/(login|register|resend-verification|verify|password-reset|change-password)(/|$) { limit_req zone=auth burst=5 nodelay; proxy_pass http://api_pool; }
  location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass http://api_pool; }
  location /django-admin/ { limit_req zone=auth burst=5 nodelay; proxy_pass http://api_pool; }
  location /static/ { alias /srv/static/; expires 7d; access_log off; }
  location /media/ { return 404; }
  location ~ /\. { deny all; }
  location / { proxy_pass http://frontend_pool; }
 }
}
